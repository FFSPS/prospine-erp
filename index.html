<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP ProSpine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #040815; --card: #080f26; --bdr: #13244d; --teal: #14b8a6; --tx: #f1f5f9; --tx2: #94a3b8; --gr: #22c55e; --rd: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--tx); margin: 0; padding: 25px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bdr); padding-bottom: 20px; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 26px; color: var(--teal); font-weight: 600; letter-spacing: -0.5px; }
        .status { font-size: 13px; color: var(--tx2); background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--bdr); }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background-color: var(--card); border: 1px solid var(--bdr); padding: 20px; border-radius: 6px; border-top: 3px solid var(--bdr); }
        .kpi-card h3 { margin: 0 0 10px 0; font-size: 11px; color: var(--tx2); text-transform: uppercase; letter-spacing: 1px; }
        .kpi-card .val { font-size: 26px; font-weight: 700; color: var(--tx); }
        .kpi-card:nth-child(1) { border-top-color: #3b82f6; } /* Braço 1 */
        .kpi-card:nth-child(2) { border-top-color: #8b5cf6; } /* Braço 2 */
        .kpi-card:nth-child(3) { border-top-color: var(--teal); } /* Total */
        .kpi-card:nth-child(4) { border-top-color: var(--gr); } /* Lucro */

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .chart-box { background-color: var(--card); border: 1px solid var(--bdr); padding: 20px; border-radius: 6px; height: 300px; }
        
        .table-section { background-color: var(--card); border: 1px solid var(--bdr); padding: 20px; border-radius: 6px; overflow-x: auto; }
        .table-section h2 { margin: 0 0 20px 0; font-size: 15px; color: var(--tx); text-transform: uppercase; letter-spacing: 1px;}
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid var(--bdr); }
        th { color: var(--tx2); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="header">
        <h1>ERP ProSpine</h1>
        <div class="status" id="conn-status">Processando API...</div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><h3>Faturamento Braço 1 (Clínica)</h3><div class="val" id="fat1">Leitura...</div></div>
        <div class="kpi-card"><h3>Faturamento Braço 2 (Info)</h3><div class="val" id="fat2">Leitura...</div></div>
        <div class="kpi-card"><h3>Faturamento Total</h3><div class="val" id="fatT" style="color: var(--teal);">Leitura...</div></div>
        <div class="kpi-card"><h3>Lucro Líquido</h3><div class="val" id="lucro">Leitura...</div></div>
        <div class="kpi-card"><h3>Ocupação de Agenda</h3><div class="val" id="ocup">Leitura...</div></div>
        <div class="kpi-card"><h3>Ticket Médio Clínica</h3><div class="val" id="ticket">Leitura...</div></div>
    </div>

    <div class="charts-grid">
        <div class="chart-box"><canvas id="graficoComparativo"></canvas></div>
        <div class="chart-box"><canvas id="graficoSoma"></canvas></div>
    </div>

    <div class="table-section">
        <h2>Matriz de Dados Analíticos (Tempo Real)</h2>
        <table id="data-table">
            <thead id="tb-head"></thead>
            <tbody id="tb-body"></tbody>
        </table>
    </div>

    <script>
        const endpoint = "https://script.google.com/macros/s/AKfycbyqSrt6O5rDIlyq89Lp_QVYCIdb29-3KVTKZayyDKVKAlKuPWcDhuY_g7pqPcikjsdh/exec";

        async function inicializarOperacao() {
            const statusLabel = document.getElementById('conn-status');
            try {
                const req = await fetch(endpoint);
                const data = await req.json();
                
                statusLabel.innerText = "Sincronizado: " + new Date().toLocaleTimeString();
                statusLabel.style.borderColor = "var(--gr)";
                statusLabel.style.color = "var(--gr)";
                
                renderizarComponentes(data);
            } catch (error) {
                statusLabel.innerText = "Falha de Conexão na Base de Dados";
                statusLabel.style.borderColor = "var(--rd)";
                statusLabel.style.color = "var(--rd)";
                console.error("Erro Crítico de Fetch:", error);
            }
        }

        function renderizarComponentes(data) {
            if(!data || data.length === 0) return;

            // 1. Matriz de Dados
            const cabecalhos = data[0];
            let thHtml = '<tr>';
            cabecalhos.forEach(c => thHtml += `<th>${c}</th>`);
            thHtml += '</tr>';
            document.getElementById('tb-head').innerHTML = thHtml;

            let tbHtml = '';
            for(let i = 1; i < Math.min(data.length, 25); i++) {
                tbHtml += '<tr>';
                data[i].forEach(cel => tbHtml += `<td>${cel}</td>`);
                tbHtml += '</tr>';
            }
            document.getElementById('tb-body').innerHTML = tbHtml;

            // 2. Gráficos Comparativos e de Soma Momentânea
            const chartOptions = { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } }, 
                scales: { 
                    y: { grid: { color: '#13244d' }, ticks: { color: '#475569' } }, 
                    x: { grid: { color: '#13244d' }, ticks: { color: '#475569' } } 
                } 
            };

            const ctxComp = document.getElementById('graficoComparativo').getContext('2d');
            new Chart(ctxComp, {
                type: 'line',
                data: {
                    labels: ['S1', 'S2', 'S3', 'S4'],
                    datasets: [
                        { label: 'Braço 1 (Clínica)', data: [0,0,0,0], borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.3 },
                        { label: 'Braço 2 (Info)', data: [0,0,0,0], borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', tension: 0.3 }
                    ]
                },
                options: chartOptions
            });

            const ctxSoma = document.getElementById('graficoSoma').getContext('2d');
            new Chart(ctxSoma, {
                type: 'bar',
                data: {
                    labels: ['S1', 'S2', 'S3', 'S4'],
                    datasets: [{
                        label: 'Faturamento Total (Br 1 + Br 2)',
                        data: [0, 0, 0, 0],
                        backgroundColor: '#14b8a6',
                        borderRadius: 4
                    }]
                },
                options: chartOptions
            });
        }

        window.addEventListener('DOMContentLoaded', inicializarOperacao);
    </script>
</body>
</html>
